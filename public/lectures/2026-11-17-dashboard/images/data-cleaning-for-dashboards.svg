<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 76 960 386" width="960" height="386" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/>
    </marker>
  </defs>

  <rect x="0" y="76" width="960" height="386" fill="#ffffff"/>

  <!-- Pipeline -->
  <g text-anchor="middle">
    <!-- 1 -->
    <rect x="40" y="100" width="130" height="130" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <circle cx="105" cy="132" r="16" fill="#2563eb"/>
    <text x="105" y="138" font-size="16" font-weight="700" fill="#fff">1</text>
    <text x="105" y="180" font-size="18" font-weight="700" fill="#1e3a8a">Ingest</text>
    <text x="105" y="206" font-size="14" fill="#334155">Keep raw copy</text>

    <!-- 2 -->
    <rect x="190" y="100" width="130" height="130" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
    <circle cx="255" cy="132" r="16" fill="#0d9488"/>
    <text x="255" y="138" font-size="16" font-weight="700" fill="#fff">2</text>
    <text x="255" y="180" font-size="18" font-weight="700" fill="#134e4a">Profile</text>
    <text x="255" y="206" font-size="14" fill="#334155">Find the gaps</text>

    <!-- 3 -->
    <rect x="340" y="100" width="130" height="130" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <circle cx="405" cy="132" r="16" fill="#7c3aed"/>
    <text x="405" y="138" font-size="16" font-weight="700" fill="#fff">3</text>
    <text x="405" y="180" font-size="17" font-weight="700" fill="#4c1d95">Standardize</text>
    <text x="405" y="206" font-size="14" fill="#334155">Common formats</text>

    <!-- 4 -->
    <rect x="490" y="100" width="130" height="130" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <circle cx="555" cy="132" r="16" fill="#d97706"/>
    <text x="555" y="138" font-size="16" font-weight="700" fill="#fff">4</text>
    <text x="555" y="180" font-size="17" font-weight="700" fill="#78350f">Deduplicate</text>
    <text x="555" y="206" font-size="14" fill="#334155">Remove repeats</text>

    <!-- 5 -->
    <rect x="640" y="100" width="130" height="130" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
    <circle cx="705" cy="132" r="16" fill="#e11d48"/>
    <text x="705" y="138" font-size="16" font-weight="700" fill="#fff">5</text>
    <text x="705" y="180" font-size="18" font-weight="700" fill="#881337">Validate</text>
    <text x="705" y="206" font-size="14" fill="#334155">Flag bad values</text>

    <!-- 6: Dashboard -->
    <rect x="790" y="100" width="130" height="130" rx="12" fill="#0f172a"/>
    <rect x="828" y="116" width="54" height="36" rx="4" fill="#1e293b" stroke="#475569"/>
    <rect x="835" y="136" width="7" height="10" fill="#5eead4"/>
    <rect x="846" y="129" width="7" height="17" fill="#5eead4"/>
    <rect x="857" y="124" width="7" height="22" fill="#5eead4"/>
    <rect x="868" y="132" width="7" height="14" fill="#5eead4"/>
    <text x="855" y="180" font-size="18" font-weight="700" fill="#f8fafc">Dashboard</text>
    <text x="855" y="206" font-size="14" fill="#cbd5e1">Ready to use</text>
  </g>

  <!-- Arrows -->
  <g stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="172" y1="165" x2="187" y2="165"/>
    <line x1="322" y1="165" x2="337" y2="165"/>
    <line x1="472" y1="165" x2="487" y2="165"/>
    <line x1="622" y1="165" x2="637" y2="165"/>
    <line x1="772" y1="165" x2="787" y2="165"/>
  </g>

  <!-- Feedback loop -->
  <path d="M 705 234 C 705 282, 405 282, 405 240" fill="none" stroke="#e11d48" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrowRose)"/>
  <text x="555" y="296" text-anchor="middle" font-size="15" font-style="italic" fill="#9f1239">Fix issues at the source</text>

  <!-- Considerations -->
  <text x="40" y="340" font-size="13" font-weight="700" letter-spacing="1.5" fill="#64748b">KEY CONSIDERATIONS</text>
  <g>
    <rect x="40" y="352" width="205" height="86" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="40" y="352" width="6" height="86" rx="3" fill="#2563eb"/>
    <text x="60" y="386" font-size="18" font-weight="700" fill="#0f172a">Completeness</text>
    <text x="60" y="414" font-size="14" fill="#334155">Report what's missing</text>

    <rect x="265" y="352" width="205" height="86" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="265" y="352" width="6" height="86" rx="3" fill="#0d9488"/>
    <text x="285" y="386" font-size="18" font-weight="700" fill="#0f172a">Consistency</text>
    <text x="285" y="414" font-size="14" fill="#334155">Same code, every time</text>

    <rect x="490" y="352" width="205" height="86" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="490" y="352" width="6" height="86" rx="3" fill="#e11d48"/>
    <text x="510" y="386" font-size="18" font-weight="700" fill="#0f172a">Privacy</text>
    <text x="510" y="414" font-size="14" fill="#334155">Suppress small counts</text>

    <rect x="715" y="352" width="205" height="86" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="715" y="352" width="6" height="86" rx="3" fill="#7c3aed"/>
    <text x="735" y="386" font-size="18" font-weight="700" fill="#0f172a">Reproducibility</text>
    <text x="735" y="414" font-size="14" fill="#334155">Script it, version it</text>
  </g>
</svg>
